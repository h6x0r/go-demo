version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: "users-postgres"
    environment:
      POSTGRES_DB: "usersdb"
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "secret"
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: "go-users-app"
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "usersdb"
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "secret"
    depends_on:
      - db

volumes:
  db_data: